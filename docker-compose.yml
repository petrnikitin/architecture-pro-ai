version: '3.8'

services:
  rag-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber-nexus-rag-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/vector_db:/app/data/vector_db:ro
      - ./logs:/app/logs
      - ./data/new_docs:/app/data/new_docs
      - ./.huggingface_cache:/app/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  rag-network:
    driver: bridge
